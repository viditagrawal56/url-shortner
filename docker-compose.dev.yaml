services:
  urlshortner.db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=urlshortnerdb
    volumes:
      - urlshortnerdb_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    restart: on-failure
    healthcheck:
      test:  ["CMD-SHELL", "pg_isready -q -d urlshortnerdb -U postgres"]
      timeout: 10s
      interval: 5s
      retries: 10

volumes:
  urlshortnerdb_data: